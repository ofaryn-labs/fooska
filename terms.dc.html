<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f7f4ee; color: #262019; -webkit-font-smoothing: antialiased; font-family: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif; }
  a { color: #C6512F; text-decoration: none; }
  a:hover { color: #7A3418; }
  ::selection { background: rgba(198,81,47,0.18); }

</helmet>

<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><rect width="96" height="96" rx="20" fill="#C6512F"/><g transform="translate(20 20) scale(0.58)"><path d="M31 35 C26 25 28 16 35 19 C40 21 41 29 40 36 Z" fill="#FBE4D8"/><path d="M65 35 C70 25 68 16 61 19 C56 21 55 29 56 36 Z" fill="#FBE4D8"/><path d="M48 25 C35 25 28 34 28 47 C28 60 36 71 48 79 C60 71 68 60 68 47 C68 34 61 25 48 25 Z" fill="#FBE4D8"/><ellipse cx="48" cy="63" rx="11" ry="9" fill="#FBF3EC"/><path d="M36 46 Q40 41 44 46 Q40 50 36 46 Z" fill="#7A3418"/><path d="M52 46 Q56 41 60 46 Q56 50 52 46 Z" fill="#7A3418"/><path d="M44 56 Q48 53 52 56 Q48 61 44 56 Z" fill="#7A3418"/></g></svg></template>
<div>

<header style="position:sticky; top:0; z-index:50; background:rgba(247,244,238,0.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid rgba(0,0,0,0.06);">
  <nav style="max-width:820px; margin:0 auto; padding:14px 26px; display:flex; align-items:center; justify-content:space-between; gap:20px;">
    <a href="index.html" style="display:flex; align-items:center; gap:11px;">
      <span style="display:inline-flex; width:38px; height:38px; border-radius:11px; background:linear-gradient(135deg,#E2795A,#C6512F); align-items:center; justify-content:center;">
        <svg viewBox="0 0 96 96" width="26" height="26" aria-hidden="true"><path d="M48 25 C35 25 28 34 28 47 C28 60 36 71 48 79 C60 71 68 60 68 47 C68 34 61 25 48 25 Z" fill="#FBE4D8"></path><ellipse cx="48" cy="63" rx="11" ry="9" fill="#FBF3EC"></ellipse><path d="M36 46 Q40 41 44 46 Q40 50 36 46 Z" fill="#7A3418"></path><path d="M52 46 Q56 41 60 46 Q56 50 52 46 Z" fill="#7A3418"></path><path d="M44 56 Q48 53 52 56 Q48 61 44 56 Z" fill="#7A3418"></path></svg>
      </span>
      <span style="font-family:'Newsreader',serif; font-weight:600; font-size:23px; color:#7A3418;">Fooska</span>
    </a>
    <a href="index.html" style="font-size:14.5px; color:#5c554a;">← Back to home</a>
  </nav>
</header>

<main style="max-width:820px; margin:0 auto; padding:60px 26px 80px;">
  <div style="font-size:12.5px; text-transform:uppercase; letter-spacing:0.7px; color:#a89c88; font-weight:600; margin-bottom:14px;">Legal</div>
  <h1 style="font-family:'Newsreader',serif; font-weight:500; font-size:48px; line-height:1.05; letter-spacing:-0.4px; margin:0;">Terms of Service</h1>
  <p style="font-size:14.5px; color:#a89c88; margin:14px 0 0;">Last updated {{ updated }}</p>
  <div style="margin-top:40px; padding:22px 24px; background:rgba(198,81,47,0.07); border:1px solid rgba(198,81,47,0.16); border-radius:16px; font-size:14.5px; line-height:1.6; color:#7a4126;">This is a starter template. Have it reviewed by legal counsel and replace the placeholder details before publishing.</div>

  <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="6">
    <section style="margin-top:40px;">
      <h2 style="font-family:'Newsreader',serif; font-weight:600; font-size:26px; margin:0 0 14px; color:#262019;">{{ sec.h }}</h2>
      <sc-for list="{{ sec.p }}" as="para" hint-placeholder-count="2">
        <p style="font-size:16px; line-height:1.7; color:#4a4238; margin:0 0 14px;">{{ para }}</p>
      </sc-for>
    </section>
  </sc-for>
</main>

<footer style="border-top:1px solid rgba(0,0,0,0.08); padding:36px 26px;">
  <div style="max-width:820px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:20px; flex-wrap:wrap; font-size:14px; color:#5c554a;">
    <span style="font-family:'Newsreader',serif; font-weight:600; font-size:18px; color:#7A3418;">Fooska</span>
    <div style="display:flex; gap:24px; flex-wrap:wrap;">
      <a href="index.html" style="color:#5c554a;">Home</a>
      <a href="privacy.html" style="color:#5c554a;">Privacy</a>
      <a href="mailto:hello@fooska.app" style="color:#5c554a;">Support</a>
    </div>
  </div>
</footer>

</div>
</x-dc>

    };
  }
}
</script>
</body>
</html>
